        // 2. Load saved states from localStorage if they exist
        const savedData = localStorage.getItem('wedding_guests_tables');
        if (savedData) {
            try {
                guests = JSON.parse(savedData);
            } catch (e) {
                console.error("Could not load saved data");
            }
        }

        // 3. Render the lists grouped by table
        function renderGuests(filterText = "") {
            const container = document.getElementById('tableListContainer');
            container.innerHTML = "";

            // Filter guests based on search input
            const filteredGuests = guests.filter(guest => 
                guest.name.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredGuests.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6">No guests found</p>`;
                updateStats();
                return;
            }

            // Group filtered guests by table name
            const grouped = {};
            filteredGuests.forEach(guest => {
                if (!grouped[guest.table]) {
                    grouped[guest.table] = [];
                }
                grouped[guest.table].push(guest);
            });

            // Loop through each table group and build UI
            for (const [tableName, tableGuests] of Object.entries(grouped)) {
                const tableSection = document.createElement('div');
                tableSection.className = "bg-gray-50 rounded-lg p-4 border border-gray-200";

                let tableHtml = `<h3 class="font-semibold text-pink-600 text-lg mb-3 border-b pb-1">${tableName}</h3>`;
                tableHtml += `<div class="space-y-2">`;

                tableGuests.forEach(guest => {
                    tableHtml += `
                        <label class="flex items-center space-x-3 cursor-pointer py-1 px-2 hover:bg-white rounded transition">
                            <input 
                                type="checkbox" 
                                ${guest.checked ? 'checked' : ''} 
                                onclick="toggleGuest(${guest.id})"
                                class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 border-gray-300"
                            >
                            <span class="text-gray-700 font-medium ${guest.checked ? 'line-through text-gray-400' : ''}">${guest.name}</span>
                        </label>
                    `;
                });

                tableHtml += `</div>`;
                tableSection.innerHTML = tableHtml;
                container.appendChild(tableSection);
            }

            updateStats();
        }

        // 4. Update the global progress counter
        function updateStats() {
            const checkedCount = guests.filter(g => g.checked).length;
            document.getElementById('stats').innerText = `Checked: ${checkedCount} / ${guests.length}`;
        }

        // 5. Toggle check status and save to localStorage
        function toggleGuest(id) {
            const guest = guests.find(g => g.id === id);
            if (guest) {
                guest.checked = !guest.checked;
                localStorage.setItem('wedding_guests_tables', JSON.stringify(guests));
                const searchTerm = document.getElementById('searchBox').value;
                renderGuests(searchTerm);
            }
        }

        // 6. Filter handler for search bar
        function filterGuests() {
            const searchTerm = document.getElementById('searchBox').value;
            renderGuests(searchTerm);
        }

        // Initial render
        renderGuests();
    </script>
